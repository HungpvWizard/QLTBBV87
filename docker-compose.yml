version: '3.8'

services:
  # 1. Ứng dụng chính AssetFlow (Backend .NET 8 + Frontend React)
  assetflow-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: assetflow_system
    restart: always
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5000
      - DatabaseProvider=SqlServer
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=AssetManagementDB;User Id=sa;Password=AssetFlow@BVQY87#2026;TrustServerCertificate=True;MultipleActiveResultSets=True;
    volumes:
      - ./data:/app/data
      - ./backups:/app/backups
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - assetflow-net

  # 2. Máy chủ Cơ sở dữ liệu Microsoft SQL Server 2022
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: assetflow_mssql
    restart: always
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=AssetFlow@BVQY87#2026
      - MSSQL_PID=Express
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'AssetFlow@BVQY87#2026' -C -Q 'SELECT 1' || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P 'AssetFlow@BVQY87#2026' -Q 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - assetflow-net

networks:
  assetflow-net:
    driver: bridge

volumes:
  mssql_data:
    driver: local
